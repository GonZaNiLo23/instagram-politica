# Render de piezas en la nube (sin el PC encendido).
# Dos formas de lanzarlo:
#  1. Encargo en el repositorio (lo usan los agentes en la nube): un archivo cola/render/NNN-slug.json con
#     {"pieza": "NNN-slug", "version": "v1", "voz": true}. Al hacer push se renderiza y el encargo se borra.
#  2. A mano: GitHub → Actions → Render de pieza → Run workflow (o gh workflow run render.yml -f pieza=… -f version=…).
# Resultado de cada pieza:
#  - el vídeo final se sube al release "listos" (de ahí lo coge el publicador de la cola);
#  - voz, tiempos, portada y fotogramas de control vuelven al repositorio (videos/piezas/NNN-slug/) para el revisor;
#  - artefacto de descarga con vídeo, portada y control (14 días);
#  - registro en cola/render/hecho.md.
# Publicar NO se hace aquí: lo hace publicar.yml con la cola de publicación y su aprobación.
# Claves: secretos del repositorio (ELEVENLABS_*); nunca en el código.
name: Render de pieza

on:
  push:
    branches: [main]
    paths: ["cola/render/*.json"]
  workflow_dispatch:
    inputs:
      pieza:
        description: "Pieza (NNN-slug)"
        required: true
      version:
        description: "Versión del render (v1, v2…)"
        default: "v1"
      voz:
        description: "Regenerar la voz con ElevenLabs (gasta créditos)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Lista de encargos
        env:
          PIEZA: ${{ inputs.pieza }}
          VERSION: ${{ inputs.version }}
          VOZ: ${{ inputs.voz }}
        run: |
          : > encargos.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "$PIEZA $VERSION $VOZ -" >> encargos.txt
          else
            for f in cola/render/*.json; do
              [ -f "$f" ] || continue
              node -e 'const j=require("./"+process.argv[1]);console.log(`${j.pieza} ${j.version||"v1"} ${j.voz?"true":"false"} ${process.argv[1]}`)' "$f" >> encargos.txt
            done
          fi
          while read -r p v z f; do
            [[ "$p" =~ ^([0-9]{3}|am[0-9]{8}-[0-9]{4})-[a-z0-9-]+$ ]] || { echo "Pieza no válida: $p"; exit 1; }
            [[ "$v" =~ ^v[0-9]+$ ]] || { echo "Versión no válida: $v"; exit 1; }
            [ -f "videos/piezas/$p/escenas.json" ] || { echo "Falta videos/piezas/$p/escenas.json"; exit 1; }
          done < encargos.txt
          cat encargos.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: videos/remotion/package-lock.json

      - name: ffmpeg y librerías del navegador de Remotion
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Dependencias de Remotion
        working-directory: videos/remotion
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL }}
          ELEVENLABS_AJUSTES: ${{ secrets.ELEVENLABS_AJUSTES }}
        run: |
          gh release view listos >/dev/null 2>&1 || gh release create listos --title "Vídeos listos para publicar" --notes "Renders finales (los usa la cola de publicación)."
          estado=0
          while read -r p v z f; do
            VOZ=""; [ "$z" = "true" ] && VOZ="--voz"
            # Al minuto horario: clip de origen desde el release "fuentes-alminuto"
            [ "$f" != "-" ] && node herramientas/al-minuto/encargo.mjs clip "$f" >> "render-$p.log" 2>&1
            if node videos/scripts/render.mjs "$p" "--v=$v" $VOZ > "render-$p.log" 2>&1; then
              gh release upload listos "videos/renders/$p-$v.mp4" --clobber
              resumen=$(grep -E "ffprobe:|Volumen integrado" "render-$p.log" | tr '\n' ' ')
              echo "- $(date -u +%FT%TZ) · $p $v · OK · $resumen" >> cola/render/hecho.md
              # Al minuto horario con "publicar": true → a la cola de publicación para ya
              if [ "$f" != "-" ] && node herramientas/al-minuto/encargo.mjs encolar "$f"; then git add estado/cola-publicacion.json; echo "publicar=1" >> "$GITHUB_ENV"; fi
            else
              estado=1
              echo "- $(date -u +%FT%TZ) · $p $v · ERROR: $(tail -3 "render-$p.log" | tr '\n' ' ')" >> cola/render/hecho.md
            fi
            cat "render-$p.log"
            [ "$f" != "-" ] && git rm -q "$f"
            git add -f "videos/piezas/$p" cola/render/hecho.md
          done < encargos.txt
          echo "estado=$estado" >> "$GITHUB_ENV"

      - name: Guardar en el repositorio
        if: always()
        run: |
          git config user.name "render-nube"
          git config user.email "render-nube@users.noreply.github.com"
          git diff --cached --quiet || { git commit -q -m "Render en la nube: $(cut -d' ' -f1,2 encargos.txt | tr '\n' ' ')"; git pull --rebase -q && git push -q; }

      # Al minuto horario: publicar en cuanto termina el render (cola.mjs: vetos, aprobación y TikTok en borradores)
      - name: Publicar lo encolado
        if: env.publicar == '1'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          git pull --rebase -q
          node herramientas/publicar-api/cola.mjs
          git add estado/cola-publicacion.json estado/registro-publicacion.md 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "Publicación automática (Al minuto)"; git pull --rebase -q && git push -q; }

      - name: Resultado
        if: always()
        run: exit ${estado:-0}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            videos/renders/*.mp4
            videos/piezas/*/portada.png
            videos/piezas/*/control/*.png
