# Publicador automático de Instagram: cada 15 min revisa estado/cola-publicacion.json y publica lo que toca
# (herramientas/publicar-api/cola.mjs). Respeta los vetos de estado/vetos.md y exige "aprobacion" en cada entrada.
# Solo reels de Instagram; TikTok y carruseles siguen a mano. Claves: secretos IG_USER_ID e IG_ACCESS_TOKEN.
name: Publicar cola

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo subir a Meta, sin publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay algo que publicar?
        id: hay
        run: |
          n=$(node -e 'const c=require("./estado/cola-publicacion.json");console.log(c.filter(e=>e.estado==="pendiente"&&Date.parse(e.hora)<=Date.now()).length)' 2>/dev/null || echo 0)
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.hay.outputs.n != '0'
        with:
          node-version: 22

      - name: Publicar
        if: steps.hay.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PRUEBA: ${{ inputs.prueba && '--prueba' || '' }}
        run: |
          node herramientas/publicar-api/cola.mjs $PRUEBA
          git config user.name "publicador-nube"
          git config user.email "publicador-nube@users.noreply.github.com"
          git add estado/cola-publicacion.json estado/registro-publicacion.md 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "Publicación automática: cola actualizada"; git pull --rebase -q && git push -q; }
