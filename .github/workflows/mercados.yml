# Historia diaria de mercados (formato aprobado el 2026-10-26; ver tareas/historia-mercados.md). Dos partes:
#  1. datos (lunes a viernes, 21:05 UTC = 22:05 Madrid en invierno): cierres con videos/scripts/mercados.mjs → estado/mercados/AAAA-MM-DD.json
#  2. publicar (al llegar estado/mercados/AAAA-MM-DD-textos.json, que escribe la rutina de Claude tras contrastar
#     cifras y causas): renderiza las tres pantallas y las publica como historias de Instagram. Registro en estado/mercados/registro.md.
name: Historia de mercados

on:
  schedule:
    - cron: "5 21 * * 1-5"
  push:
    branches: [main]
    paths: ["estado/mercados/*-textos.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercados
  cancel-in-progress: false

jobs:
  datos:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cierres del día
        run: node videos/scripts/mercados.mjs "$(TZ=Europe/Madrid date +%F)"
      - name: Guardar
        run: |
          git config user.name "mercados-nube"
          git config user.email "mercados-nube@users.noreply.github.com"
          git add estado/mercados
          git diff --cached --quiet || { git commit -q -m "Mercados: cierres del $(TZ=Europe/Madrid date +%F)"; git pull --rebase -q && git push -q; }

  publicar:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fecha de la historia
        run: |
          f=$(git diff --name-only HEAD~1 HEAD -- 'estado/mercados/*-textos.json' | head -1)
          fecha=$(basename "$f" -textos.json)
          [[ "$fecha" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "No encuentro la fecha en $f"; exit 1; }
          [ "$fecha" = "$(TZ=Europe/Madrid date +%F)" ] || { echo "Los textos son de $fecha, no de hoy: no se publica"; exit 0; }
          echo "FECHA=$fecha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: env.FECHA != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: videos/remotion/package-lock.json
      - name: ffmpeg y navegador de Remotion
        if: env.FECHA != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          cd videos/remotion && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Renderizar y publicar
        if: env.FECHA != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node videos/scripts/historia-mercados.mjs "$FECHA"
          d="estado/mercados/$FECHA"
          if salida=$(node herramientas/publicar-api/instagram.mjs historia "$d/1-portada.png" "$d/2-cifras.png" "$d/3-porque.png" 2>&1); then
            r="publicada: $(echo "$salida" | grep -o 'PUBLICADO [0-9]*' | tr '\n' ' ')"
          else
            r="ERROR al publicar: $(echo "$salida" | tail -2 | tr '\n' ' ')"
          fi
          echo "$salida"
          echo "- $FECHA · $(node -e 'console.log(require("./estado/mercados/'"$FECHA"'-textos.json").titular)') · $r" >> estado/mercados/registro.md
          git config user.name "mercados-nube"
          git config user.email "mercados-nube@users.noreply.github.com"
          git add -f "$d" estado/mercados/registro.md
          git commit -q -m "Historia de mercados $FECHA: $r" && git pull --rebase -q && git push -q
